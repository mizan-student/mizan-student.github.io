<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزان | أدوات الطالب</title>
<meta name="description" content="أدوات مجانية بالعربي للطلاب: حاسبة المعدل التراكمي، محوّل التاريخ الهجري والميلادي، وغيرها.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f6; --card:#ffffff; --ink:#14213d; --muted:#5b6b82; --line:#d5dee8; --accent:#1f6f8b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1623; --card:#16212f; --ink:#e8eef6; --muted:#93a3b9; --line:#27364a; --accent:#4fb0cf}
}
:root[data-theme="dark"]{--bg:#0e1623; --card:#16212f; --ink:#e8eef6; --muted:#93a3b9; --line:#27364a; --accent:#4fb0cf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:2rem;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 24px}
.tools{display:grid;gap:12px}
a.tool{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);text-decoration:none}
a.tool:hover{border-color:var(--accent)}
a.tool:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a.tool strong{display:block;font-size:1.1rem}
a.tool span{color:var(--muted);font-size:.95rem}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>ميزان</h1>
  <p class="lead">أدوات مجانية بالعربي تساعد الطالب في حساباته اليومية.</p>
  <nav class="tools" aria-label="الأدوات">
    <a class="tool" href="gpa-calculator.html"><strong>حاسبة المعدل التراكمي</strong><span>احسب معدلك الفصلي والتراكمي بسلم 4.0 أو 5.0.</span></a>
    <a class="tool" href="hijri-converter.html"><strong>محوّل التاريخ هجري وميلادي</strong><span>حوّل بين التقويمين مع اسم اليوم والشهر.</span></a>
  </nav>
  <footer>أدوات جديدة تضاف باستمرار.</footer>
</main>
</body>
</html>
